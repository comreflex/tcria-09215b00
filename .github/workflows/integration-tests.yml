name: Integration Tests — Cross-Product

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install all products
        run: |
          pip install -r requirements.txt
          pip install -e products/quinta-ordem-gate
          pip install -e products/precision-gate-core
          pip install pytest
      - name: Run all tests
        run: |
          pytest tests/test_engine_smoke.py tests/integration/ -q --tb=short
