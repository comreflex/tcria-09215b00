name: Test — Precision Gate Core

on:
  push:
    branches: ["main"]
    paths:
      - "products/precision-gate-core/**"
      - "tests/integration/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-precision-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install precision-gate-core
        run: pip install -e products/precision-gate-core[dev]
      - name: Install quinta-ordem-gate (for full pipeline)
        run: pip install -e products/quinta-ordem-gate
      - name: Lint (compile check)
        run: python -m compileall -q products/precision-gate-core
      - name: Run Precision Gate integration tests
        run: pytest tests/integration/ -q
